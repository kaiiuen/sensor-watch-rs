# Build configuration for the SAM L22 (Cortex-M0+)
[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
# flip-link places the stack at the bottom of RAM so a stack overflow triggers
# an immediate hard fault instead of silently corrupting data. It wraps the
# rust-lld linker, so cargo still finds rust-lld through the toolchain.
rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "linker=flip-link",
]
