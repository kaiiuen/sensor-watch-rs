[workspace]
resolver = "2"
members = [
    ".",
    "core",
]

[package]
name = "sensor-watch"
version = "0.1.0"
edition = "2024"
description = "A Rust rewrite of the Sensor-Watch firmware for the Microchip SAM L22"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["device"] }
panic-halt = "0.2"
atsaml22j = { version = "0.1.0", features = ["rt"] }

# Optional: embedded-hal traits for driver-style code
embedded-hal = "0.2"

# Math functions for no_std (used by the thermistor temperature calculation)
libm = "0.2"
critical-section = "1.2.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
