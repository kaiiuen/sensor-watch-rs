[workspace]
resolver = "2"
members = [
    ".",
    "core",
    "studio",
    "tools",
]
# `cargo build` / `cargo run` at the root operate on the GUI app by default.
# The firmware is built explicitly with `--target thumbv6m-none-eabi`.
default-members = ["studio"]

[package]
name = "sensor-watch"
version = "0.1.0"
edition = "2024"
description = "A Rust rewrite of the Sensor-Watch firmware for the Microchip SAM L22"
license = "MIT OR Apache-2.0"

# Host-testable library target.
#
# The firmware crate is a pure binary (`src/main.rs`, `#![no_std]`/`#![no_main]`)
# for the `thumbv6m-none-eabi` target, and this package's bin is built unchanged
# (the `main.rs` bin keeps its own `mod watch`/`mod movement`). The library below
# makes the same crate usable as a host dependency (`cargo test`, Studio, fuzzers).
#
# On the `thumbv6m-none-eabi` target the library artifact is also produced but is
# NOT referenced by the on-device binary (which falls back to Cargo's autolink
# only if the bin path `use`s it); the firmware build is verified to link the same
# machine code as before this change.
[lib]
name = "sensor_watch"
path = "src/lib.rs"
# `rlib` plus `staticlib` for potential C/FFI embedding. See the note near the
# host `panic`/allocator in `src/lib.rs` for how host builds make this linkable.
crate-type = ["rlib", "staticlib"]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["device"] }
atsaml22j = { version = "0.1.0", features = ["rt"] }

# Optional SWD/RTT structured logging. These stay out of the default dependency
# graph and are only linked for the explicitly enabled ARM firmware feature.
defmt = { version = "0.3.10", optional = true }
defmt-rtt = { version = "0.4.0", optional = true }

# Math functions for no_std (used by the thermistor temperature calculation)
libm = "0.2"
critical-section = "1.2.0"

# Shared host-testable logic + the `Hw` seam. The firmware depends on the core
# crate so that, on host builds, the ARM-bound register backends can forward to
# the reusable `sensor_watch_core::mock_hw` trait/mock. On the
# `thumbv6m-none-eabi` target this dependency is inert (hostmock is not enabled).
sensor-watch-core = { path = "./core", optional = true }

[features]
# Optional optical command/status scaffolding. Keep it out of the default
# firmware image until a board-level optical receiver is available.
optical = []
# Only available to the host (`cargo test` / `cargo build` / `cargo run`, NOT the
# `thumbv6m-none-eabi` firmware target). Gates the mock HW dispatch in `watch`.
hostmock = ["dep:sensor-watch-core"]
# Host builds that link this lib into a `std` binary (e.g. the Studio app) enable
# this so the lib compiles as `std` and lets `std` provide the `#[panic_handler]`
# and `#[global_allocator]` lang items. Without it (ARM firmware, host `cargo
# test`), the lib stays `no_std` and provides its own minimal lang items.
std = []
# Require an explicit physical-presence integration to authorize mutating shell
# commands. The default remains unlocked to preserve the UART jig workflow.
shell-auth = []
# Reserve the native SAM L22 USB CDC application path. It is intentionally
# disabled by default because USB raises the clock/power floor and the current
# PAC/dependency graph cannot implement endpoint transfers. ARM builds with this
# feature fail explicitly at firmware startup; host feature checks are tests only.
usb-cdc = []
# Opt-in structured logs over the SWD probe's RTT channel. This is deliberately
# not part of any default feature and is valid only for the ARM firmware target.
defmt-log = ["dep:defmt", "dep:defmt-rtt"]

[dev-dependencies]

[profile.dev]
opt-level = 1
# The `sensor_watch` lib is `no_std` (the ARM firmware has no `std`, and the host
# lib target mirrors that to link the real faces). An unwinding panic strategy
# needs `std`, which does not exist for the firmware or the no_std host lib, so the
# dev profile builds with abort.
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The host GUI app uses a normal optimization level (not size-optimized).
[profile.release.package.sensor-watch-studio]
opt-level = 2