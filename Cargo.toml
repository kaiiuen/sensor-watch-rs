[workspace]
resolver = "2"
members = [
    ".",
    "core",
    "studio",
]
# `cargo build` / `cargo run` at the root operate on the GUI app by default.
# The firmware is built explicitly with `--target thumbv6m-none-eabi`.
default-members = ["studio"]

[package]
name = "sensor-watch"
version = "0.1.0"
edition = "2024"
description = "A Rust rewrite of the Sensor-Watch firmware for the Microchip SAM L22"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["device"] }
panic-halt = "0.2"
atsaml22j = { version = "0.1.0", features = ["rt"] }

# Optional: embedded-hal traits for driver-style code
embedded-hal = "0.2"

# Math functions for no_std (used by the thermistor temperature calculation)
libm = "0.2"
critical-section = "1.2.0"

# flip-link places the stack at the bottom of RAM so a stack overflow triggers
# an immediate hard fault instead of silently corrupting data. It is used as the
# linker (see .cargo/config.toml) and must be installed as a build dependency.
[build-dependencies]
flip-link = "0.1"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The host GUI app uses a normal optimization level (not size-optimized).
[profile.release.package.sensor-watch-studio]
opt-level = 2
