[package]
name = "sensor-watch-desktop-update"
version = "0.1.0"
edition = "2021"
description = "Bounded, authenticated desktop release acquisition"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
url = "2"

[dev-dependencies]
rand = "0.8"
