[package]
name = "sensor-watch-studio"
version = "0.1.0"
edition = "2021"
description = "Firmware Studio - a GUI companion app for the Sensor-Watch firmware"
license = "MIT OR Apache-2.0"

[features]
# Enables the Simulator to run REAL firmware faces through the host `Hw` seam.
# On by default: the firmware host lib compiles and links cleanly as a `std`
# dependency, and `RealFace::new` installs its `MockHw` into the host seam (and
# clears it on drop). See `src/real_face.rs`.
real-faces = ["dep:sensor-watch"]
default = ["real-faces"]

[dependencies]
# GUI framework (pure Rust, cross-platform)
eframe = "0.27"
egui = "0.27"

# Host-local civil time for the simulator's Reset to now/startup policy.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# SVG rendering for the watch face (1:1 F-91W replica)
resvg = "0.42"
usvg = "0.42"

# Firmware logic (UF2 encoding, date math, settings) - reused from the firmware
sensor-watch-core = { path = "../core" }
# Host-side firmware build, UF2, recovery, and flashing tools for CLI mode.
sensor-watch-tools = { path = "../tools" }
# The firmware crate's host [lib] (`sensor_watch`, feature `hostmock`), used to
# render faces through the real `Hw` seam (see `src/real_face.rs`), falling back
# to `face_sim` for faces not yet migrated. The `std` feature makes the firmware
# lib compile as a `std` dependency so it links into this app without duplicating
# `std`'s `#[panic_handler]`/`#[global_allocator]` lang items.
sensor-watch = { path = "../", features = ["hostmock", "std"], optional = true }

# Settings save/export (serialization)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System clipboard for exporting settings JSON
arboard = "3"

# System resource usage (CPU, RAM, storage, network) for the footer
sysinfo = { version = "0.35", features = ["network"] }

# HTTP client for fetching the release checksum
ureq = "2"

# Offline artifact manifests and generation checksums
sha2 = "0.10"

# Open the GitHub repo in the default browser when the title is clicked
webbrowser = "1"

# Cross-platform host serial ports for the documented UART jig (not USB CDC)
serialport = "4.7"
