[package]
name = "sensor-watch-studio"
version = "0.1.0"
edition = "2021"
description = "Firmware Studio — a GUI companion app for the Sensor-Watch firmware"
license = "MIT OR Apache-2.0"

[dependencies]
# GUI framework (pure Rust, cross-platform)
eframe = "0.27"
egui = "0.27"

# SVG rendering for the watch face (1:1 F-91W replica)
resvg = "0.42"
usvg = "0.42"

# Firmware logic (UF2 encoding, date math, settings) — reused from the firmware
sensor-watch-core = { path = "../core" }

# Settings save/export (serialization)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System clipboard for exporting settings JSON
arboard = "3"

# System resource usage (CPU, RAM, storage, network) for the footer
sysinfo = { version = "0.35", features = ["network"] }

# HTTP client for fetching the release checksum
ureq = "2"

# Open the GitHub repo in the default browser when the title is clicked
webbrowser = "1"
