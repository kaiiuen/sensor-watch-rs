[package]
name = "sensor-watch-launcher"
version = "0.1.0"
edition = "2021"
description = "Standalone folder-based Windows launcher for Sensor Watch Studio"
license = "MIT OR Apache-2.0"

[dependencies]
sensor-watch-desktop-update = { path = "../desktop-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "sensor-watch-studio-launcher"
path = "src/main.rs"
