name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (thumbv6m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Build firmware
        run: cargo build --target thumbv6m-none-eabi
      - name: Build firmware (release)
        run: cargo build --release --target thumbv6m-none-eabi
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensor-watch-elf
          path: target/thumbv6m-none-eabi/release/sensor-watch

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (firmware)
        # The firmware exposes the full C-reference HAL API and many ported
        # faces, which carry intentional dead-code and pedantic style lints.
        # Keep this informational; the core crate below is the strict gate.
        run: cargo clippy --target thumbv6m-none-eabi
      - name: Clippy (core)
        run: cargo clippy -p sensor-watch-core --target x86_64-unknown-linux-gnu -- -D warnings

  test:
    name: Test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run core tests
        # Override the workspace's embedded target so tests run on the host.
        run: cargo test -p sensor-watch-core --target x86_64-unknown-linux-gnu

  studio:
    name: Build Studio (GUI app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libssl-dev libgtk-3-dev
      - name: Build Studio
        run: cargo build -p sensor-watch-studio
      - name: Run Studio tests
        run: cargo test -p sensor-watch-studio

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check
