name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (thumbv6m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          channel: '1.97.1'
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Build firmware
        run: cargo build --target thumbv6m-none-eabi -p sensor-watch
      - name: Build firmware (release)
        run: cargo build --release --target thumbv6m-none-eabi -p sensor-watch
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensor-watch-elf
          path: target/thumbv6m-none-eabi/release/sensor-watch

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          channel: '1.97.1'
          targets: thumbv6m-none-eabi
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (firmware)
        # The firmware exposes the full C-reference HAL API and many ported
        # faces, which carry intentional dead-code and pedantic style lints.
        # Keep this informational; the core crate below is the strict gate.
        run: cargo clippy --target thumbv6m-none-eabi -p sensor-watch
      - name: Clippy (core)
        run: cargo clippy -p sensor-watch-core --target x86_64-unknown-linux-gnu -- -D warnings

  test:
    name: Test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          channel: '1.97.1'
      - uses: Swatinem/rust-cache@v2
      - name: Run core tests
        # Override the workspace's embedded target so tests run on the host.
        run: cargo test -p sensor-watch-core --target x86_64-unknown-linux-gnu

  studio:
    name: Build Studio (GUI app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          channel: '1.97.1'
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libssl-dev libgtk-3-dev
      - name: Build Studio
        run: cargo build -p sensor-watch-studio
      - name: Run Studio tests
        run: cargo test -p sensor-watch-studio

  uf2:
    name: Build UF2 artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          channel: '1.97.1'
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Install binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi
      - name: Build firmware (release)
        run: cargo build --release --target thumbv6m-none-eabi -p sensor-watch
      - name: Extract raw binary
        run: |
          arm-none-eabi-objcopy -O binary \
            target/thumbv6m-none-eabi/release/sensor-watch \
            target/thumbv6m-none-eabi/release/sensor-watch.bin
      - name: Convert to UF2
        run: |
          cargo run -p sensor-watch-core --bin uf2tool -- \
            target/thumbv6m-none-eabi/release/sensor-watch.bin \
            target/thumbv6m-none-eabi/release/sensor-watch.uf2
      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensor-watch-uf2
          path: target/thumbv6m-none-eabi/release/sensor-watch.uf2

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          channel: '1.97.1'
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  audit:
    name: Audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo audit
        uses: actions-rust-lang/audit@v1
        # Report-only: pre-existing advisories must not block unrelated changes.
        # The action self-installs cargo-audit and posts a findings summary to the
        # step summary; output is still visible even though the step won't fail.
        continue-on-error: true
        with:
          # Don't auto-create GitHub issues for advisories on this run.
          createIssues: false
